<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,close,filter_list,menu&display=block" />
    <link rel="stylesheet" href="styles/header.css" type="text/css">
    <script src="js/header.js" defer></script>
    <script>
        // Apply saved or default theme on load
        const THEME_NAME = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", `${THEME_NAME}`);
    </script>
</head>

<body>
    <header></header>

    <style>
        section {
            width: 100%;
            margin: 50px 0 0 0;
        }

        h2 {
            display: block;
            color: var(--h3);
            margin-left: 20px;
            position: relative;
            z-index: 0;
            font-weight: 600;
            font-size: 14px;
        }

        .card-section {
            display: flex;
            gap: 10px;
            padding: 24px 22px 0;
        }

        .card {
            flex: 1;
            border-radius: 14px;
            background: var(--accent);
            border: 1px solid var(--border);
            padding: 12px;
            position: relative;
        }

        .card-time {
            color: var(--stext);
            border: 1px dashed var(--stext);
            border-radius: 14px;
            padding: 2px 8px;
            width: fit-content;
            font-size: small;
            justify-self: flex-end;
            align-self: flex-start;
            margin-bottom: 15px;
        }

        .card-number {
            color: var(--brand);
            font-family: 'Fraunces', serif;
            font-size: 35px;
            font-weight: 600;
            line-height: 1;
        }

        .card-number-lbl {
            color: var(--ptext);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.5;
            align-self: last baseline;
        }

        .card-marks {
            margin-top: 15px;
            color: var(--ptext);
            font-weight: 600;
            opacity: 0.9;
            letter-spacing: 0.05em;
        }

        .card-marks span {
            font-weight: 500;
            margin-left: 10px;
            color: var(--ptext);
            opacity: 0.5;
        }

        .card-name {
            position: absolute;
            bottom: -24px;
            color: var(--ptext);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.9;
        }

        #total-result .card {
            padding: 0;
            background: var(--brand);
            border: none
        }

        #total-result .card-time {
            color: var(--ttext);
            margin: 12px 12px 15px;
        }

        #total-result .card-number {
            color: var(--bgcolor);
            margin: 0 12px;
        }

        #total-result .card-marks {
            margin: 12px 0 0;
            padding: 5px 12px 12px;
            /* 12+5=17 => 15 (margin-top) + 1 (card border) + 1 (card border) = 17 */
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            color: var(--ptext);
            background: var(--accent);
            opacity: 1;
        }

        #total-result .card-name {
            padding-left: 12px;
        }

        @media screen and (min-width: 500px) {
            section {
                margin: 50px auto;
            }

            .card-section {
                gap: 20px;
            }

            #result-div {
                max-width: 1500px;
                margin: auto;
                display: flex;
                gap: 0;
            }

            .temp {
                display: none;
            }

            #total-result-section {
                flex-basis: 30%;
            }

            #total-result {
                padding-right: 0px;
            }
        }

        #question-section {
            background: white;
            overflow: scroll;
        }

        .bar-graph-div {
            display: flex;
            gap: auto;
            background-color: beige;
            height: 300px;
            padding: 24px 0 0;
            margin: 0 22px 24px 22px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .bar {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-left: 50px;
            width: 70px;
            min-width: fit-content;
            position: relative;
            align-self: flex-end;
        }

        .bar-correct {
            background-color: green;
        }

        .bar-incorrect {
            background-color: red;
        }
        
        .physics {
            background-color: brown;
            height: calc(2400/25 * 1%);
        }

        .physics .bar-incorrect {
            height: calc();
        }
        
        .chemistry {
            background-color: aqua;
            height: calc(2000/25 * 1%);
        }

        .chemistry .bar-incorrect {
            height: calc(1900/20 * 25%);
        }

        .mathematics {
            background-color: chartreuse;
            height: calc(1600/25 * 1%);
        }

        .chemistry .bar-incorrect {
            height: calc(1200/25 * 1%);
        }

        .bar-attempted-question {
            position: absolute;
            top: -24px;
            color: var(--stext);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            margin: 5px 0 0;
            opacity: 0.9;
        }

        .bar-subject-name {
            position: absolute;
            bottom: -24px;
            color: var(--ptext);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 5px 0 0;
            opacity: 0.9;
        }
    </style>

    <div id="result-div">
        <section id="total-result-section">
            <h2>TOTAL RESULT</h2>

            <div id="total-result" class="card-section">
                <div class="card">
                    <div class="card-time">02:53:59</div>
                    <div style="display: flex; gap: 10px;">
                        <div class="card-number">59/75</div>
                        <div class="card-number-lbl"></div>
                    </div>
                    <div class="card-marks">+176 / 300 <span>Marks</span></div>
                    <div class="card-name">TOTAL</div>
                </div>
                <div class="card temp" style="visibility: hidden;">
                </div>
                <div class="card temp" style="visibility: hidden;">
                </div>
            </div>

        </section>
        <section id="overall-result-section">
            <h2>OVERALL RESULT</h2>

            <div id="overall-result" class="card-section">
                <div class="card">
                    <div class="card-time">01:15:35</div>
                    <div style="display: flex; gap: 10px;">
                        <div class="card-number">47</div>
                        <div class="card-number-lbl">Qs</div>
                    </div>
                    <div class="card-marks">+188<span>Marks</span></div>
                    <div class="card-name">CORRECT</div>
                </div>
                <div class="card">
                    <div class="card-time">00:47:56</div>
                    <div style="display: flex; gap: 10px;">
                        <div class="card-number">12</div>
                        <div class="card-number-lbl">Qs</div>
                    </div>
                    <div class="card-marks">-12<span>Marks</span></div>
                    <div class="card-name">INCORRECT</div>
                </div>
                <div class="card">
                    <div class="card-time">00:50:28</div>
                    <div style="display: flex; gap: 10px;">
                        <div class="card-number">16</div>
                        <div class="card-number-lbl">Qs</div>
                    </div>
                    <div class="card-marks">0<span>Marks</span></div>
                    <div class="card-name">UNATTEMPTED</div>
                </div>

            </div>

        </section>
    </div>

    <div id="distribution-div">
        <section id="question-section">
            <h2>QUESTION</h2>

            <div class="bar-graph-div">
                <div class="bar physics">
                    <p class="bar-attempted-question">24 Qs</p>
                    <div class="bar-correct">22 Qs</div>
                    <div class="bar-incorrect">2 Qs</div>
                    <h4 class="bar-subject-name">Physics</h4>
                </div>
                <div class="bar chemistry">
                    <p class="bar-attempted-question">20 Qs</p>
                    <div class="bar-correct">19 Qs</div>
                    <div class="bar-incorrect">1 Qs</div>
                    <h4 class="bar-subject-name">Chemistry</h4>
                </div>
                <div class="bar mathematics">
                    <p class="bar-attempted-question">16 Qs</p>
                    <div class="bar-correct">12 Qs</div>
                    <div class="bar-incorrect">4 Qs</div>
                    <h4 class="bar-subject-name">Mathematics</h4>
                </div>
            </div>
        </section>
    </div>
    <div style="height: 100vh;"></div>
    <footer></footer>
</body>

</html>
